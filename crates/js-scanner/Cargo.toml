[package]
name = "frontend-js-scanner"
version = "0.0.4"
edition = "2021"
description = "OXC-based JS/TS/JSX/TSX analysis for frontend-analyzer-provider"
license = "Apache-2.0"
repository = "https://forge.hurley.page/shawn_hurley/frontend-analyzer-provider"

[dependencies]
frontend-core = { version = "0.0.4", path = "../core" }

# OXC - JavaScript/TypeScript toolchain (used by CSS class/var scanning)
oxc_parser = "0.116"
oxc_ast = "0.116"
oxc_allocator = "0.116"
oxc_span = "0.116"

# AST index for pre-computed cross-file data
ast-index = { path = "../../../ast-index", features = ["serde"] }
ast-index-react = { path = "../../../ast-index-languages/react" }
ast-index-typescript = { path = "../../../ast-index-languages/typescript" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling
anyhow = "1"

# Utilities
regex = "1"
walkdir = "2"
glob = "0.3"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
