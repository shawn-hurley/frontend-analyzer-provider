[package]
name = "frontend-grpc"
version = "0.0.4"
edition = "2021"
description = "Konveyor gRPC provider interface for frontend-analyzer-provider"
license = "Apache-2.0"
repository = "https://forge.hurley.page/shawn_hurley/frontend-analyzer-provider"

[features]
generate-proto = ["dep:tonic-build", "dep:dlprotoc"]

[dependencies]
frontend-core = { version = "0.0.4", path = "../core" }
frontend-js-scanner = { version = "0.0.4", path = "../js-scanner" }
frontend-css-scanner = { version = "0.0.4", path = "../css-scanner" }

# AST index for cross-file symbol tracking and React-specific analysis
ast-index = { path = "../../../ast-index", features = ["serde"] }
ast-index-react = { path = "../../../ast-index-languages/react" }

# gRPC
tonic = "0.13"
prost = "0.13"
prost-types = "0.13"
tonic-reflection = "0.13"

# Async
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-core = "0.3"
async-stream = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"

# Error handling
anyhow = "1"

# Utilities
regex = "1"
url = "2"

# Logging
tracing = "0.1"

[build-dependencies]
tonic-build = { version = "0.13", optional = true }
dlprotoc = { version = "0.4", optional = true }
